apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: execution

resources:
  - base/namespace.yml
  - features/execution-api/configmap.yml
  - features/execution-api/deployment.yml
  - features/execution-api/hpa.yml
  - features/execution-api/service.yml

secretGenerator:
  - name: execution-api-secrets
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
